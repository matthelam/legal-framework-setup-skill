name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version stamped in the skill
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "Framework version: ${v}\." legal-framework/SKILL.md
          grep -q "FRAMEWORK_VERSION = \"${v}\"" legal-framework/assets/memory.py

      - name: Package the skill
        run: zip -r "legal-framework-${GITHUB_REF_NAME}.zip" legal-framework

      - name: Extract this version's release notes
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "legal-framework-${GITHUB_REF_NAME}.zip" \
            --title "Legal Framework ${GITHUB_REF_NAME}" --notes-file notes.md
